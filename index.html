<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Suppress benign [vite] websocket connection messages in AI Studio iframe environment
      (function() {
        // 1. Provide a lightweight mock for vite-hmr websocket to prevent network connection errors
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              var isVite = (protocols === 'vite-hmr') ||
                           (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                           (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf(':24678') !== -1));
              if (isVite) {
                var listeners = {};
                var fakeWs = {
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  url: url,
                  protocol: 'vite-hmr',
                  addEventListener: function(type, listener) {
                    if (!listeners[type]) listeners[type] = [];
                    listeners[type].push(listener);
                    if (type === 'open') {
                      setTimeout(function() {
                        try { listener({ type: 'open', target: fakeWs }); } catch(e) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function(type, listener) {
                    if (listeners[type]) {
                      listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                    }
                  },
                  dispatchEvent: function(event) {
                    var list = listeners[event.type] || [];
                    for (var i = 0; i < list.length; i++) {
                      try { list[i](event); } catch(e) {}
                    }
                    return true;
                  },
                  send: function() {},
                  close: function() {
                    fakeWs.readyState = 3;
                    var closeList = listeners['close'] || [];
                    for (var i = 0; i < closeList.length; i++) {
                      try { closeList[i]({ type: 'close', wasClean: true }); } catch(e) {}
                    }
                  }
                };
                return fakeWs;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch(e) {}

        // 2. Filter console.error and console.warn for [vite]
        var origError = console.error;
        var origWarn = console.warn;
        function isViteNoise(args) {
          try {
            for (var i = 0; i < args.length; i++) {
              var str = typeof args[i] === 'string' ? args[i] : (args[i] && args[i].message) ? args[i].message : '';
              if (str && (str.indexOf('[vite]') !== -1 || str.indexOf('websocket') !== -1)) {
                return true;
              }
            }
          } catch(e) {}
          return false;
        }
        console.error = function() {
          if (isViteNoise(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteNoise(arguments)) return;
          return origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('[vite]') !== -1 || event.message.indexOf('websocket') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
